spring.application.name=gerenciadorcaixas

# sem profile ativo, sobe como dev (carrega os dados de demonstracao).
# Em producao: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/aqua_management}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# o schema e do Flyway (db/migration); o Hibernate so confere se as entidades batem
spring.jpa.hibernate.ddl-auto=validate
