services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: aqua_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # CURRENT_DATE (data_admissao) usa o fuso do servidor
      TZ: America/Sao_Paulo
    ports:
      # 5434 para nao brigar com o banco do CLI (5433) nem com um Postgres local (5432)
      - "${DB_PORT:-5434}:5432"
    volumes:
      # sem scripts de init: quem cria as tabelas e o Flyway, na subida da API
      - dados:/var/lib/postgresql

volumes:
  dados:
